<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=overlays-content">
    <meta name="theme-color" id="theme-color-meta" content="#064e3b">
    <title>إدارة الإعلانات | السوق وياك</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { navy: '#0f172a', darkbg: '#1e293b', brand: '#10b981' }, fontFamily: { sans:['Cairo', 'sans-serif'] }, screens: { 'xs': '400px' } } } }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        html { background-color: #f1f5f9; } .dark html { background-color: #0f172a; } body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; } 
        .no-scrollbar::-webkit-scrollbar { display: none; } .select-none { user-select: none; } 
        .sticky-header { z-index: 40; background-color: #064e3b; box-shadow: 0 4px 10px rgba(0,0,0,0.15); } 
        .dark .sticky-header { background-color: #1e293b; border-bottom: 1px solid rgba(255,255,255,0.05); } 
        .input-box { width: 100%; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 0.5rem; padding: 0.4rem 0.6rem; font-size: 0.75rem; font-weight: 700; outline: none; color: #0f172a; } 
        .dark .input-box { background: #0f172a; border-color: #334155; color: white; } 
        .custom-select { appearance: none; background-color: #f8fafc; border: 1px solid #cbd5e1; border-radius: 0.4rem; padding: 0.35rem 1.5rem 0.35rem 0.5rem; width: 100%; font-weight: 700; font-size: 0.75rem; color: #334155; cursor: pointer; } 
        .dark .custom-select { background-color: #0f172a; color: white; border-color: #334155; } 
        .custom-select-wrapper { position: relative; } 
        .custom-select-icon { position: absolute; left: 0.5rem; top: 50%; transform: translateY(-50%); pointer-events: none; color: #64748b; width: 0.8rem; height: 0.8rem; } 
        .amenity-tile input:checked + div { background-color: #10b981; color: white; border-color: #10b981; } 
        .toast { animation: slideInDown 0.2s ease-out forwards; } .toast.hiding { animation: fadeOut 0.2s ease-in forwards; } 
        @keyframes slideInDown { from { transform: translate(-50%, -100%); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translate(-50%, -20px); } }
        
        /* أنيميشن القوائم المنسدلة */
        .accordion-content { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
        .accordion-content.open { grid-template-rows: 1fr; }
        .accordion-inner { overflow: hidden; }
        
        /* شاشة تسجيل الدخول */
        .auth-overlay { position: fixed; inset: 0; z-index: 100; background-color: #0f172a; display: flex; align-items: center; justify-content: center; padding: 1rem; }

        /* تأثير القائمة المنسدلة المخصصة */
        .dropdown-menu { transform-origin: top; transform: scaleY(0.95); opacity: 0; transition: all 0.15s ease; pointer-events: none; }
        .dropdown-menu.show { transform: scaleY(1); opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="text-slate-800 dark:text-slate-100 select-none hidden" id="admin-body">

    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[10000] flex flex-col items-center gap-2 pointer-events-none w-full px-4"></div>

    <header class="fixed top-0 w-full sticky-header flex items-center justify-between px-4 h-14">
        <div class="flex items-center gap-3">
            <div class="flex flex-col justify-center">
                <span class="text-[9px] font-bold text-red-300 leading-none">إدارة الإعلانات</span>
                <span class="text-[13px] font-black text-white leading-tight">السوق <span class="text-yellow-400">وياك</span></span>
            </div>
        </div>
        <div class="flex gap-2 items-center">
            <button onclick="toggleAddForm()" class="px-3 py-1.5 rounded-lg bg-emerald-500 text-white text-[10px] font-bold hover:bg-emerald-600 transition-all flex items-center gap-1"><i data-lucide="plus" class="w-3 h-3"></i> إضافة عقار</button>
            <button onclick="toggleDarkMode()" class="p-1.5 rounded-full bg-white/20 text-white hover:bg-white/30 transition-all"><i data-lucide="moon" class="w-3.5 h-3.5 block dark:hidden"></i><i data-lucide="sun" class="w-3.5 h-3.5 hidden dark:block text-yellow-300"></i></button>
            <button onclick="logoutAdmin()" class="p-1.5 rounded-full bg-red-500/80 text-white hover:bg-red-500 transition-all"><i data-lucide="log-out" class="w-4 h-4"></i></button>
        </div>
    </header>

    <main class="pt-[4.5rem] pb-10 container mx-auto px-2 max-w-3xl min-h-screen">
        
        <!-- نموذج الإضافة والتعديل المدمج -->
        <div id="inline-form-container" class="accordion-content">
            <div class="accordion-inner">
                <div class="mb-3 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-emerald-500 dark:border-emerald-600 p-3">
                    <div class="flex justify-between items-center mb-3 border-b border-slate-100 dark:border-slate-700 pb-2">
                        <h3 id="form-title" class="font-bold text-emerald-600 dark:text-emerald-400 text-xs flex items-center gap-1"><i data-lucide="edit-3" class="w-4 h-4"></i> إضافة إعلان جديد</h3>
                        <button onclick="toggleAddForm()" class="text-slate-400 hover:text-red-500"><i data-lucide="x" class="w-4 h-4"></i></button>
                    </div>
                    
                    <div class="space-y-3">
                        <!-- الصور -->
                        <div>
                            <label class="block text-[9px] font-bold text-slate-500 mb-1">الصور (بحد أقصى 10)</label>
                            <div class="flex gap-2 items-center">
                                <label class="w-12 h-12 shrink-0 border-2 border-dashed border-emerald-300 bg-emerald-50 dark:bg-slate-900 rounded-lg flex flex-col items-center justify-center cursor-pointer text-emerald-600 relative">
                                    <input type="file" id="file-upload-input" multiple accept="image/*,video/*" onchange="handleUpload(this)" class="absolute inset-0 opacity-0 z-10">
                                    <i data-lucide="camera" class="w-4 h-4"></i>
                                </label>
                                <div id="preview-area" class="flex-1 flex gap-1 overflow-x-auto no-scrollbar"></div>
                            </div>
                        </div>

                        <!-- البيانات الأساسية -->
                        <div class="grid grid-cols-2 gap-2">
                            <div class="custom-select-wrapper">
                                <select id="in-category" onchange="updateFormFields()" class="custom-select">
                                    <option value="apartment">شقة</option><option value="villa">فيلا</option><option value="chalet">شاليهات</option><option value="office">مكتب</option><option value="shop">محلات</option><option value="land">أراضي</option><option value="building">عماير</option><option value="warehouse">مخازن</option>
                                </select>
                                <i data-lucide="chevron-down" class="custom-select-icon w-3 h-3"></i>
                            </div>
                            <div class="custom-select-wrapper">
                                <select id="in-type" class="custom-select"><option value="sale">بيع</option><option value="rent">إيجار</option></select>
                                <i data-lucide="chevron-down" class="custom-select-icon w-3 h-3"></i>
                            </div>
                            <input id="in-title" class="input-box col-span-2" placeholder="عنوان الإعلان">
                            <input id="in-price" type="number" class="input-box" placeholder="السعر (جنيه)">
                            <input id="in-area" type="number" class="input-box" placeholder="المساحة (م²)">
                            
                            <input id="in-level" type="text" class="input-box" placeholder="الدور">
                            <input id="in-floors-alt" type="number" class="input-box hidden" placeholder="عدد الأدوار">
                            
                            <div id="land-type-wrapper" class="hidden custom-select-wrapper">
                                <select id="in-land-type" class="custom-select"><option value="building">مباني</option><option value="agriculture">زراعية</option></select>
                                <i data-lucide="chevron-down" class="custom-select-icon w-3 h-3"></i>
                            </div>
                        </div>

                        <div id="land-fields" class="hidden grid grid-cols-2 gap-2">
                            <input id="in-feddan" type="number" class="input-box" placeholder="فدان (اختياري)">
                            <input id="in-qirat" type="number" class="input-box" placeholder="قيراط (اختياري)">
                        </div>
                        <div id="building-fields" class="hidden grid grid-cols-2 gap-2">
                            <input id="in-apartments" type="number" class="input-box" placeholder="عدد الشقق">
                        </div>
                        <div id="room-fields" class="grid grid-cols-2 gap-2">
                            <input id="in-rooms" type="number" class="input-box" placeholder="عدد الغرف">
                            <input id="in-baths" type="number" class="input-box" placeholder="عدد الحمامات">
                        </div>
                        <div id="extra-fields" class="grid grid-cols-2 gap-2">
                            <input id="in-balconies" type="number" class="input-box" placeholder="عدد البلكونات">
                            <div class="custom-select-wrapper">
                                <select id="in-finishing" class="custom-select"><option value="" disabled selected>نوع التشطيب</option><option value="red">طوب أحمر</option><option value="semi">نصف تشطيب</option><option value="full">تشطيب كامل</option><option value="super">سوبر لوكس</option><option value="ultra">الترا سوبر لوكس</option></select>
                                <i data-lucide="chevron-down" class="custom-select-icon w-3 h-3"></i>
                            </div>
                        </div>

                        <div id="furnished-field" class="flex items-center justify-between bg-slate-50 dark:bg-slate-900 p-2 rounded-lg border border-slate-200 dark:border-slate-700">
                            <span class="text-[9px] font-bold text-slate-600 dark:text-slate-300">مفروش؟</span>
                            <div class="flex gap-1">
                                <label class="cursor-pointer"><input type="radio" name="furnished" id="furn-yes" value="yes" class="peer hidden"><span class="px-3 py-0.5 rounded text-[9px] font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 peer-checked:bg-emerald-500 peer-checked:text-white transition-all">نعم</span></label>
                                <label class="cursor-pointer"><input type="radio" name="furnished" id="furn-no" value="no" checked class="peer hidden"><span class="px-3 py-0.5 rounded text-[9px] font-bold bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-500 peer-checked:bg-slate-800 peer-checked:text-white transition-all">لا</span></label>
                            </div>
                        </div>

                        <!-- الموقع والتفاصيل -->
                        <div class="grid grid-cols-2 gap-2">
                            <div class="custom-select-wrapper">
                                <select id="in-gov" onchange="populateCities('in-gov', 'in-city')" class="custom-select"><option value="" disabled selected>المحافظة</option></select>
                                <i data-lucide="chevron-down" class="custom-select-icon w-3 h-3"></i>
                            </div>
                            <div class="custom-select-wrapper">
                                <select id="in-city" class="custom-select"><option value="" disabled selected>المدينة</option></select>
                                <i data-lucide="chevron-down" class="custom-select-icon w-3 h-3"></i>
                            </div>
                            <input id="in-address" class="input-box col-span-2" placeholder="العنوان التفصيلي">
                            <input id="in-phone" type="tel" class="input-box col-span-2" placeholder="رقم الهاتف">
                        </div>

                        <div>
                            <span class="block text-[9px] font-bold text-slate-500 mb-1">المميزات</span>
                            <div class="grid grid-cols-3 xs:grid-cols-4 gap-1.5" id="amenities-grid"></div>
                        </div>
                        
                        <textarea id="in-desc" rows="2" class="input-box resize-none text-[10px]" placeholder="وصف تفصيلي..."></textarea>

                        <button onclick="submitListing()" id="btn-publish" class="w-full bg-emerald-600 text-white py-2 rounded-lg font-bold text-xs shadow-md active:scale-95 transition-all">حفظ الإعلان</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- شريط البحث والفلترة -->
        <div class="flex gap-2 mb-3 sticky top-[4rem] z-30 bg-[#f1f5f9] dark:bg-[#0f172a] py-1">
            <div class="relative flex-1">
                <input type="text" id="search-input" onkeyup="performSearch()" placeholder="بحث بالاسم أو الكود..." class="w-full bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg pl-8 pr-2 py-1.5 text-[10px] outline-none dark:text-white font-bold h-8 shadow-sm transition-none">
                <i data-lucide="search" class="absolute left-2 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-slate-400"></i>
            </div>
            
            <div class="relative w-28 shrink-0" id="custom-filter-container">
                <button onclick="toggleFilterMenu(event)" class="w-full h-8 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 flex items-center justify-between shadow-sm text-[10px] font-bold text-slate-700 dark:text-slate-200">
                    <span id="active-filter-text">كل الأقسام</span>
                    <i data-lucide="filter" class="w-3 h-3 text-slate-400"></i>
                </button>
                <div id="filter-dropdown" class="dropdown-menu absolute top-full mt-1 right-0 w-32 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-xl z-50 flex flex-col overflow-hidden">
                    <button onclick="selectFilter('', 'كل الأقسام')" class="text-right px-3 py-2 text-[10px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 border-b border-slate-100 dark:border-slate-700">كل الأقسام</button>
                    <button onclick="selectFilter('apartment', 'شقق')" class="text-right px-3 py-2 text-[10px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 border-b border-slate-100 dark:border-slate-700">شقق</button>
                    <button onclick="selectFilter('villa', 'فلل')" class="text-right px-3 py-2 text-[10px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 border-b border-slate-100 dark:border-slate-700">فلل</button>
                    <button onclick="selectFilter('chalet', 'شاليهات')" class="text-right px-3 py-2 text-[10px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 border-b border-slate-100 dark:border-slate-700">شاليهات</button>
                    <button onclick="selectFilter('office', 'مكاتب')" class="text-right px-3 py-2 text-[10px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 border-b border-slate-100 dark:border-slate-700">مكاتب</button>
                    <button onclick="selectFilter('shop', 'محلات')" class="text-right px-3 py-2 text-[10px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 border-b border-slate-100 dark:border-slate-700">محلات</button>
                    <button onclick="selectFilter('land', 'أراضي')" class="text-right px-3 py-2 text-[10px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 border-b border-slate-100 dark:border-slate-700">أراضي</button>
                    <button onclick="selectFilter('building', 'عماير')" class="text-right px-3 py-2 text-[10px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 border-b border-slate-100 dark:border-slate-700">عماير</button>
                    <button onclick="selectFilter('warehouse', 'مخازن')" class="text-right px-3 py-2 text-[10px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700">مخازن</button>
                </div>
            </div>
        </div>

        <!-- قائمة الإعلانات المدمجة -->
        <div id="listings-container" class="space-y-2"></div>
        <div id="empty-msg" class="hidden text-center py-10 text-slate-400 text-xs font-bold">لا توجد إعلانات مطابقة</div>

    </main>

    <!-- شاشة تسجيل الدخول -->
    <div id="auth-modal" class="auth-overlay">
        <div class="w-full max-w-xs mx-auto bg-slate-800 rounded-2xl shadow-xl border border-slate-700 p-6">
            <div class="flex justify-center mb-4"><div class="w-12 h-12 bg-slate-900 rounded-full flex items-center justify-center border border-emerald-500 shadow-lg"><i data-lucide="shield" class="w-6 h-6 text-emerald-500"></i></div></div>
            <h2 class="text-center text-white font-bold text-sm mb-4">تسجيل دخول الإدارة</h2>
            <div class="space-y-3">
                <input id="login-email" type="email" class="input-box text-left !text-xs" placeholder="البريد الإلكتروني للإدارة" dir="ltr">
                <input id="login-pass" type="password" class="input-box text-left !text-xs" placeholder="كلمة المرور" dir="ltr">
                <button id="btn-login" onclick="loginAdmin()" class="w-full bg-emerald-600 text-white py-2 rounded-xl font-bold text-xs shadow-md hover:bg-emerald-700 mt-2">دخول</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, getDoc, addDoc, updateDoc, deleteDoc, onSnapshot, collection, query, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = { apiKey: "AIzaSyC7zHuH8LK-yQAKG-Nm7dh31fXtVLxuCLM", authDomain: "sharqia-81030.firebaseapp.com", projectId: "sharqia-81030", storageBucket: "sharqia-81030.firebasestorage.app", messagingSenderId: "581888625195", appId: "1:581888625195:web:1667ba1e439e8e6c1fb86e" };
        const app = initializeApp(firebaseConfig); const db = getFirestore(app); const auth = getAuth(app);
        const COLLECTION_NAME = "listings_v2"; 
        const ADMIN_UID = "ebbvRbE3JTh5MIvzvfX855rY3Qx2";

        let state = { user: null, listings:[], filesToUpload:[], editingId: null, existingImages:[] };
        window.activeFilterCat = ''; 
        window.openRowId = null; // لحفظ الإعلان المفتوح حتى لا يغلق عند التحديث

        const ALL_AMENITIES =["غاز طبيعي", "كهرباء", "مياه", "أسانسير", "واي فاي", "حمام سباحة", "حديقة", "جراج", "أمن وحراسة", "كاميرات مراقبة", "مطبخ أمريكاني", "غرفة خادمة", "مسموح بالحيوانات", "على ناصية"];
        const LAND_AMENITIES =["كهرباء", "مياه", "غاز طبيعي", "على ناصية"];
        const EGYPT_LOCATIONS = { "الشرقية":["الزقازيق", "العاشر من رمضان", "منيا القمح", "بلبيس", "مشتول السوق", "القنايات", "أبو حماد", "القرين", "ههيا", "أبو كبير", "فاقوس", "الصالحية الجديدة", "الإبراهيمية", "ديرب نجم", "كفر صقر", "أولاد صقر", "الحسينية", "صان الحجر", "منشأة أبو عمر"], "القاهرة":["مدينة نصر", "مصر الجديدة", "المعادي", "التجمع الخامس", "الرحاب", "مدينتي", "الشروق", "العبور", "المقطم", "الزيتون", "حدائق القبة", "شبرا", "وسط البلد", "المنيل", "الزمالك", "المهندسين", "الدقي", "العجوزة"], "الجيزة":["6 أكتوبر", "الشيخ زايد", "الهرم", "فيصل", "المهندسين", "الدقي", "العجوزة", "إمبابة", "الوراق", "بولاق الدكرور", "العمرانية", "المنيب"] };

        onAuthStateChanged(auth, async (u) => { 
            if(u && !u.isAnonymous) { 
                if(u.uid === ADMIN_UID) {
                    state.user = u; document.getElementById('admin-body').classList.remove('hidden'); document.getElementById('auth-modal').classList.add('hidden');
                    loadListings(); renderAmenities(ALL_AMENITIES); initLocations();
                } else {
                    await signOut(auth); showToast('غير مصرح لك بالدخول', 'e');
                    document.getElementById('admin-body').classList.remove('hidden'); document.getElementById('auth-modal').classList.remove('hidden');
                }
            } else { 
                document.getElementById('admin-body').classList.remove('hidden'); document.getElementById('auth-modal').classList.remove('hidden');
            } 
        });

        window.loginAdmin = async () => { 
            const e=document.getElementById('login-email').value, w=document.getElementById('login-pass').value; if(!e||!w) return showToast('بيانات ناقصة','e');
            const btn=document.getElementById('btn-login'); btn.innerText='جاري الدخول...'; btn.disabled=true;
            try{ 
                const userCredential = await signInWithEmailAndPassword(auth, e, w); 
                if(userCredential.user.uid !== ADMIN_UID) { await signOut(auth); throw new Error('Unauthorized'); }
                showToast('تم الدخول بنجاح'); 
            } catch(err){ showToast('بيانات خاطئة أو غير مصرح', 'e'); } finally{ btn.innerText='دخول'; btn.disabled=false; }
        };
        window.logoutAdmin = async () => { if(confirm('تسجيل الخروج؟')){ await signOut(auth); window.location.reload(); } };

        function initLocations() { const sel = document.getElementById('in-gov'); if(sel) { sel.innerHTML = `<option value="" disabled selected>المحافظة</option>`; Object.keys(EGYPT_LOCATIONS).forEach(gov => { sel.innerHTML += `<option value="${gov}">${gov}</option>`; }); } }
        window.populateCities = (govId, cityId) => { const gov = document.getElementById(govId).value; const citySel = document.getElementById(cityId); citySel.innerHTML = `<option value="" disabled selected>المدينة</option>`; if(gov && EGYPT_LOCATIONS[gov]) { EGYPT_LOCATIONS[gov].forEach(city => { citySel.innerHTML += `<option value="${city}">${city}</option>`; }); } };
        function renderAmenities(list) { document.getElementById('amenities-grid').innerHTML = list.map(a => `<label class="amenity-tile cursor-pointer"><input type="checkbox" class="amenity-check hidden" value="${a}"><div class="text-center py-1 border border-slate-300 dark:border-slate-700 rounded text-[9px] font-bold text-slate-600 dark:text-slate-300 transition-all">${a}</div></label>`).join(''); }

        window.updateFormFields = () => { const cat = document.getElementById('in-category').value; const rF=document.getElementById('room-fields'), fF=document.getElementById('furnished-field'), lI=document.getElementById('in-level'), fA=document.getElementById('in-floors-alt'), lTW=document.getElementById('land-type-wrapper'), lF=document.getElementById('land-fields'), bF=document.getElementById('building-fields'), eF=document.getElementById('extra-fields'); rF.classList.remove('hidden'); fF.classList.remove('hidden'); lI.classList.remove('hidden'); fA.classList.add('hidden'); lTW.classList.add('hidden'); lF.classList.add('hidden'); bF.classList.add('hidden'); eF.classList.remove('hidden'); if(cat==='land') { renderAmenities(LAND_AMENITIES); rF.classList.add('hidden'); fF.classList.add('hidden'); lI.classList.add('hidden'); eF.classList.add('hidden'); lTW.classList.remove('hidden'); lF.classList.remove('hidden'); } else { renderAmenities(ALL_AMENITIES); if (cat === 'building') { rF.classList.add('hidden'); fF.classList.add('hidden'); lI.classList.add('hidden'); fA.classList.remove('hidden'); bF.classList.remove('hidden'); eF.classList.add('hidden'); } else if (['shop','office','warehouse'].includes(cat)) { rF.classList.add('hidden'); eF.classList.add('hidden'); } } };

        window.toggleDarkMode = () => { document.documentElement.classList.toggle('dark'); };
        window.showToast=(m,t='s')=>{const d=document.createElement('div');d.className=`toast bg-white dark:bg-slate-800 shadow-xl px-4 py-2 rounded-lg border border-${t==='e'?'red':'emerald'}-500 flex items-center gap-2 text-xs font-bold text-slate-800 dark:text-white`;d.innerHTML=`<i data-lucide="${t==='e'?'alert-circle':'check-circle'}" class="w-4 h-4 text-${t==='e'?'red':'emerald'}-500"></i> ${m}`;document.getElementById('toast-container').appendChild(d);lucide.createIcons({root:d});setTimeout(()=>{d.classList.add('hiding');setTimeout(()=>d.remove(),200)},3000)};

        // التحكم في القوائم المنسدلة (الفلتر والحالة)
        window.toggleFilterMenu = (e) => {
            if(e) e.stopPropagation();
            document.getElementById('filter-dropdown').classList.toggle('show');
        };
        window.selectFilter = (val, text) => {
            window.activeFilterCat = val;
            document.getElementById('active-filter-text').innerText = text;
            document.getElementById('filter-dropdown').classList.remove('show');
            performSearch();
        };
        
        window.toggleStatusMenu = (e, id) => {
            if(e) e.stopPropagation();
            // إغلاق أي قائمة حالة أخرى مفتوحة
            document.querySelectorAll('[id^="status-dropdown-"]').forEach(el => {
                if(el.id !== `status-dropdown-${id}`) el.classList.remove('show');
            });
            document.getElementById(`status-dropdown-${id}`).classList.toggle('show');
        };

        window.selectStatus = async (e, id, val, text) => {
            if(e) e.stopPropagation();
            document.getElementById(`status-dropdown-${id}`).classList.remove('show');
            document.getElementById(`status-text-${id}`).innerText = text;
            await updateStatus(id, val);
        };

        // إغلاق أي قائمة عند الضغط خارجها
        document.addEventListener('click', (e) => {
            const filterDropdown = document.getElementById('filter-dropdown');
            const filterContainer = document.getElementById('custom-filter-container');
            if (filterDropdown && filterDropdown.classList.contains('show') && !filterContainer.contains(e.target)) {
                filterDropdown.classList.remove('show');
            }
            
            document.querySelectorAll('[id^="status-dropdown-"]').forEach(drop => {
                if (drop.classList.contains('show')) {
                    const containerId = drop.id.replace('status-dropdown-', 'status-container-');
                    const container = document.getElementById(containerId);
                    if (container && !container.contains(e.target)) {
                        drop.classList.remove('show');
                    }
                }
            });
        });

        function loadListings() { 
            onSnapshot(query(collection(db, COLLECTION_NAME)), (snap) => { 
                state.listings =[]; 
                snap.forEach(d => state.listings.push({id:d.id, ...d.data()})); 
                state.listings.sort((a,b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0)); 
                
                const cont = document.getElementById('listings-container');
                cont.innerHTML = state.listings.map(item => createCompactRow(item)).join(''); 
                lucide.createIcons({ root: cont }); 
                
                performSearch(); 

                // استعادة الإعلان المفتوح (حتى لا ينغلق عند تحديث الحالة)
                if (window.openRowId) {
                    const content = document.getElementById(`content-${window.openRowId}`);
                    const icon = document.getElementById(`icon-${window.openRowId}`);
                    if (content) {
                        content.classList.add('open');
                        const inner = content.querySelector('.accordion-inner');
                        if(inner) inner.style.overflow = 'visible';
                        if(icon) icon.style.transform = 'rotate(180deg)';
                    }
                }
            }); 
        }
        
        window.performSearch = () => { 
            const q = document.getElementById('search-input').value.toLowerCase(); 
            const rows = document.querySelectorAll('.listing-row');
            let visibleCount = 0;

            rows.forEach(row => {
                const searchData = row.getAttribute('data-search');
                const catData = row.getAttribute('data-category');
                const matchSearch = searchData.includes(q);
                const matchCat = !window.activeFilterCat || catData === window.activeFilterCat;

                if (matchSearch && matchCat) {
                    row.style.display = 'block'; 
                    visibleCount++;
                } else {
                    row.style.display = 'none';
                }
            });

            const emptyMsg = document.getElementById('empty-msg');
            if(visibleCount === 0) emptyMsg.classList.remove('hidden');
            else emptyMsg.classList.add('hidden');
        };

        const getOptimizedUrl = (url, isVideo = false, width = 100) => { if (!url || !url.includes('cloudinary.com')) return url || `https://via.placeholder.com/${width}`; const parts = url.split('/upload/'); if (parts.length < 2) return url; let params = `w_${width},h_${width},c_fill,q_auto:eco,f_auto`; if (isVideo) { let cleanUrl = parts[1]; const lastDot = cleanUrl.lastIndexOf('.'); if (lastDot !== -1) cleanUrl = cleanUrl.substring(0, lastDot) + '.jpg'; return `${parts[0]}/upload/${params},so_0/${cleanUrl}`; } return `${parts[0]}/upload/${params}/${parts[1]}`; };

        function getStatusBadge(status) {
            if(status === 'sold') return `<span class="bg-red-100 text-red-700 px-1.5 py-0.5 rounded text-[8px] font-bold">مباع</span>`;
            if(status === 'rented') return `<span class="bg-blue-100 text-blue-700 px-1.5 py-0.5 rounded text-[8px] font-bold">مؤجر</span>`;
            return `<span class="bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded text-[8px] font-bold">متاح</span>`;
        }

        function createCompactRow(item) {
            const thumbUrl = getOptimizedUrl(item.images?.[0] || item.image, item.images?.[0]?.includes('.mp4'), 100); 
            const imagesThumbnails = (item.images ||[item.image]).map(img => `<img src="${getOptimizedUrl(img, img.includes('.mp4'), 60)}" loading="lazy" class="w-8 h-8 rounded object-cover border border-slate-200 dark:border-slate-700">`).join('');
            const searchString = `${item.title.toLowerCase()} ${item.shortCode || ''}`;
            
            const statusMap = { 'available': 'متاح', 'sold': 'مباع', 'rented': 'مؤجر' };
            const currentStatusText = statusMap[item.status] || 'متاح';

            return `
            <div class="listing-row bg-white dark:bg-slate-800 rounded-lg shadow-sm border border-slate-200 dark:border-slate-700 overflow-hidden" data-search="${searchString}" data-category="${item.category}">
                <!-- Header -->
                <div class="flex items-center p-2 cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors" onclick="toggleRow('${item.id}')">
                    <img src="${thumbUrl}" loading="lazy" class="w-12 h-12 rounded object-cover ml-2 shrink-0 border border-slate-200 dark:border-slate-700 bg-slate-100">
                    <div class="flex-1 min-w-0">
                        <div class="flex items-center gap-1 mb-0.5">
                            ${item.isPinned ? '<i data-lucide="star" class="w-3 h-3 text-yellow-500 fill-yellow-500 shrink-0"></i>' : ''}
                            <h3 class="text-[11px] font-bold truncate text-slate-800 dark:text-white">${item.title}</h3>
                        </div>
                        <div class="text-[9px] text-slate-500 flex items-center gap-2 font-bold">
                            <span class="text-emerald-600 dark:text-emerald-400">${item.price} ج</span>
                            <span class="w-1 h-1 rounded-full bg-slate-300"></span>
                            <span>كود: ${item.shortCode}</span>
                        </div>
                    </div>
                    <div class="shrink-0 flex items-center gap-2 mr-2">
                        ${getStatusBadge(item.status)}
                        <i data-lucide="chevron-down" id="icon-${item.id}" class="w-4 h-4 text-slate-400 transition-transform duration-200"></i>
                    </div>
                </div>

                <!-- Expanded Content -->
                <div id="content-${item.id}" class="accordion-content bg-slate-50 dark:bg-slate-900/50 border-t border-slate-100 dark:border-slate-700">
                    <div class="accordion-inner p-2">
                        <div class="flex gap-1 mb-2 overflow-x-auto no-scrollbar pb-1">${imagesThumbnails}</div>
                        <p class="text-[10px] text-slate-600 dark:text-slate-400 mb-3 leading-relaxed whitespace-pre-wrap">${item.desc || 'لا يوجد وصف'}</p>
                        
                        <!-- أزرار التحكم -->
                        <div id="actions-${item.id}" class="grid grid-cols-4 gap-1.5">
                            <button onclick="editListing('${item.id}')" class="bg-blue-100 text-blue-700 py-1.5 rounded text-[9px] font-bold flex items-center justify-center gap-1"><i data-lucide="edit" class="w-3 h-3"></i> تعديل</button>
                            <button onclick="showInlineDelete('${item.id}')" class="bg-red-100 text-red-700 py-1.5 rounded text-[9px] font-bold flex items-center justify-center gap-1"><i data-lucide="trash-2" class="w-3 h-3"></i> حذف</button>
                            
                            <!-- قائمة الحالة المخصصة -->
                            <div class="relative h-full" id="status-container-${item.id}">
                                <button onclick="toggleStatusMenu(event, '${item.id}')" class="w-full h-full bg-slate-200 dark:bg-slate-700 rounded text-[9px] font-bold flex items-center justify-center gap-1 text-slate-700 dark:text-slate-300">
                                    <span id="status-text-${item.id}">${currentStatusText}</span>
                                    <i data-lucide="chevron-down" class="w-3 h-3"></i>
                                </button>
                                <div id="status-dropdown-${item.id}" class="dropdown-menu absolute bottom-full mb-1 right-0 w-full min-w-[70px] bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-xl z-50 flex flex-col overflow-hidden" style="transform-origin: bottom;">
                                    <button onclick="selectStatus(event, '${item.id}', 'available', 'متاح')" class="text-center px-1 py-1.5 text-[9px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 border-b border-slate-100 dark:border-slate-700 text-emerald-600 dark:text-emerald-400">متاح</button>
                                    <button onclick="selectStatus(event, '${item.id}', 'sold', 'مباع')" class="text-center px-1 py-1.5 text-[9px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 border-b border-slate-100 dark:border-slate-700 text-red-600 dark:text-red-400">مباع</button>
                                    <button onclick="selectStatus(event, '${item.id}', 'rented', 'مؤجر')" class="text-center px-1 py-1.5 text-[9px] font-bold hover:bg-slate-50 dark:hover:bg-slate-700 text-blue-600 dark:text-blue-400">مؤجر</button>
                                </div>
                            </div>

                            <button onclick="pinListing('${item.id}', ${item.isPinned})" class="${item.isPinned?'bg-yellow-200 text-yellow-700':'bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-300'} py-1.5 rounded text-[9px] font-bold flex items-center justify-center gap-1"><i data-lucide="star" class="w-3 h-3"></i> تثبيت</button>
                        </div>

                        <!-- تأكيد الحذف المدمج -->
                        <div id="confirm-delete-${item.id}" class="hidden bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 p-2 rounded flex items-center justify-between mt-1">
                            <span class="text-[10px] font-bold text-red-600 dark:text-red-400">تأكيد الحذف نهائياً؟</span>
                            <div class="flex gap-1">
                                <button onclick="confirmDelete('${item.id}')" class="bg-red-500 text-white px-3 py-1 rounded text-[9px] font-bold">نعم</button>
                                <button onclick="cancelInlineDelete('${item.id}')" class="bg-slate-200 text-slate-700 px-3 py-1 rounded text-[9px] font-bold">إلغاء</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>`;
        }

        window.toggleRow = (id) => {
            const content = document.getElementById(`content-${id}`);
            const inner = content.querySelector('.accordion-inner');
            const icon = document.getElementById(`icon-${id}`);
            
            if(content.classList.contains('open')) {
                content.classList.remove('open');
                inner.style.overflow = 'hidden';
                icon.style.transform = 'rotate(0deg)';
                cancelInlineDelete(id); 
                window.openRowId = null;
                
                const drop = document.getElementById(`status-dropdown-${id}`);
                if(drop) drop.classList.remove('show');
            } else {
                document.querySelectorAll('.accordion-content.open').forEach(el => {
                    if(el.id !== 'inline-form-container') {
                        el.classList.remove('open');
                        const elInner = el.querySelector('.accordion-inner');
                        if(elInner) elInner.style.overflow = 'hidden';
                        const otherIcon = document.getElementById(`icon-${el.id.replace('content-','')}`);
                        if(otherIcon) otherIcon.style.transform = 'rotate(0deg)';
                    }
                });
                content.classList.add('open');
                icon.style.transform = 'rotate(180deg)';
                window.openRowId = id;
                // السماح بظهور القائمة المنسدلة خارج حدود العنصر بعد انتهاء الأنيميشن
                setTimeout(() => { if(content.classList.contains('open')) inner.style.overflow = 'visible'; }, 250);
            }
        };

        window.showInlineDelete = (id) => {
            document.getElementById(`actions-${id}`).classList.add('hidden');
            document.getElementById(`confirm-delete-${id}`).classList.remove('hidden');
        };
        window.cancelInlineDelete = (id) => {
            const actions = document.getElementById(`actions-${id}`);
            const confirm = document.getElementById(`confirm-delete-${id}`);
            if(actions) actions.classList.remove('hidden');
            if(confirm) confirm.classList.add('hidden');
        };

        window.toggleAddForm = () => {
            const form = document.getElementById('inline-form-container');
            if(form.classList.contains('open')) {
                form.classList.remove('open');
                resetAddForm();
            } else {
                form.classList.add('open');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        };

        function resetAddForm() { 
            state.filesToUpload =[]; state.editingId = null; state.existingImages =[]; 
            document.getElementById('preview-area').innerHTML = ''; 
            document.getElementById('file-upload-input').value = ''; 
            document.getElementById('in-title').value = ''; 
            document.getElementById('in-price').value = ''; 
            document.getElementById('in-area').value = ''; 
            document.getElementById('in-desc').value = ''; 
            document.getElementById('in-address').value = ''; 
            document.querySelectorAll('.amenity-check').forEach(c => c.checked = false); 
            document.getElementById('btn-publish').innerText = 'حفظ الإعلان'; 
            document.getElementById('form-title').innerHTML = '<i data-lucide="plus-circle" class="w-4 h-4"></i> إضافة إعلان جديد';
            lucide.createIcons();
        }

        window.editListing = (id) => { 
            const item = state.listings.find(i => i.id === id); if(!item) return; 
            
            const form = document.getElementById('inline-form-container');
            if(!form.classList.contains('open')) form.classList.add('open');
            window.scrollTo({ top: 0, behavior: 'smooth' });

            state.editingId = id; state.existingImages = item.images; 
            document.getElementById('form-title').innerHTML = '<i data-lucide="edit-3" class="w-4 h-4"></i> تعديل الإعلان'; 
            document.getElementById('btn-publish').innerText = 'حفظ التعديلات'; 
            
            document.getElementById('in-category').value = item.category; updateFormFields(); 
            document.getElementById('in-type').value = item.type; 
            document.getElementById('in-title').value = item.title; 
            document.getElementById('in-price').value = item.price; 
            document.getElementById('in-area').value = item.area || ''; 
            document.getElementById('in-gov').value = item.gov; populateCities('in-gov', 'in-city'); 
            setTimeout(() => document.getElementById('in-city').value = item.city, 100); 
            document.getElementById('in-address').value = item.address || ''; 
            document.getElementById('in-desc').value = item.desc || ''; 
            document.getElementById('preview-area').innerHTML = `<div class="text-[9px] p-2 text-slate-500 font-bold bg-slate-100 dark:bg-slate-800 rounded">الصور محفوظة. لتبديلها قم برفع صور جديدة.</div>`; 
            lucide.createIcons();
        };

        async function compressImage(file, targetWidth = 800) { if (file.type.startsWith('video')) return file; return new Promise((resolve) => { const reader = new FileReader(); reader.readAsDataURL(file); reader.onload = (e) => { const img = new Image(); img.src = e.target.result; img.onload = () => { const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d'); let width = img.width; let height = img.height; if (width > targetWidth) { height *= targetWidth / width; width = targetWidth; } canvas.width = width; canvas.height = height; ctx.drawImage(img, 0, 0, width, height); canvas.toBlob((blob) => resolve(new File([blob], file.name, { type: 'image/jpeg' })), 'image/jpeg', 0.7); }; }; }); }
        window.handleUpload = async (input) => { if(input.files.length > 10) return showToast('10 ملفات كحد أقصى','e'); state.filesToUpload=[]; for(let f of input.files){ state.filesToUpload.push(await compressImage(f)); } document.getElementById('preview-area').innerHTML = state.filesToUpload.map(f => `<div class="w-10 h-10 bg-emerald-100 text-emerald-700 rounded flex items-center justify-center text-[8px] font-bold shrink-0">جاهز</div>`).join(''); };
        async function uploadToCloudinary(file) { const formData = new FormData(); formData.append('file', file); formData.append('upload_preset', 'souq_upload'); const res = await fetch('https://api.cloudinary.com/v1_1/db9h7zm1h/auto/upload', { method: 'POST', body: formData }); const data = await res.json(); return data.secure_url; }

        window.submitListing = async () => { 
            try { 
                const gov = document.getElementById('in-gov').value; const city = document.getElementById('in-city').value; if(!gov || !city) return showToast('اختر المحافظة والمدينة', 'e'); 
                let uploadedUrls =[]; 
                if(state.filesToUpload.length > 0) { const btn = document.getElementById('btn-publish'); btn.innerText='جاري الرفع...'; btn.disabled = true; for(let f of state.filesToUpload) uploadedUrls.push(await uploadToCloudinary(f)); } 
                else if (state.editingId) uploadedUrls = state.existingImages; 
                else return showToast('مطلوب صورة','e'); 

                document.getElementById('btn-publish').innerText = 'جاري الحفظ...'; 
                const am =[]; document.querySelectorAll('.amenity-check:checked').forEach(c => am.push(c.value)); 
                const cat = document.getElementById('in-category').value; 
                const listingData = { title: document.getElementById('in-title').value, price: Number(document.getElementById('in-price').value), type: document.getElementById('in-type').value, category: cat, area: Number(document.getElementById('in-area').value)||0, gov: gov, city: city, address: document.getElementById('in-address').value, phone: document.getElementById('in-phone').value, desc: document.getElementById('in-desc').value, amenities: am, images: uploadedUrls, image: uploadedUrls[0] }; 
                if(state.editingId) { await updateDoc(doc(db, COLLECTION_NAME, state.editingId), listingData); showToast('تم التعديل'); } 
                else { listingData.shortCode = Math.floor(100+Math.random()*900).toString(); listingData.status = 'available'; listingData.isPinned = false; listingData.createdAt = serverTimestamp(); await addDoc(collection(db, COLLECTION_NAME), listingData); showToast('تم النشر'); } 
                toggleAddForm(); 
            } catch(e) { showToast('حدث خطأ', 'e'); document.getElementById('btn-publish').disabled = false; } 
        };

        window.confirmDelete = async (id) => { await deleteDoc(doc(db, COLLECTION_NAME, id)); showToast('تم الحذف'); };
        window.pinListing = async (id, currentStatus) => { await updateDoc(doc(db, COLLECTION_NAME, id), {isPinned: !currentStatus}); showToast('تم تحديث التثبيت'); };
        window.updateStatus = async (id, newStatus) => { await updateDoc(doc(db, COLLECTION_NAME, id), { status: newStatus }); showToast('تم تحديث الحالة'); };

        lucide.createIcons();
    </script>
</body>
</html>
